<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Hunter - Simple RPG Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        h1 {
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .stats {
            background: #0f3460;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat {
            background: #16213e;
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 100px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
        }
        
        .health-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff4757);
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .enemy {
            background: #2c3e50;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        
        .enemy-name {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .enemy-art {
            font-size: 60px;
            margin: 10px 0;
        }
        
        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .attack-btn { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .heal-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .restart-btn { background: linear-gradient(135deg, #fa709a, #fee140); }
        
        .log {
            background: #000000aa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            height: 120px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #ffd93d;
            padding-left: 10px;
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .game-over-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .victory {
            color: #ffd93d;
        }
        
        .defeat {
            color: #ff6b6b;
        }
        
        .hidden {
            display: none;
        }
        
        .name-input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            text-align: center;
            margin: 10px 0;
        }
        
        .start-screen {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Start Screen -->
        <div id="startScreen" class="start-screen">
            <h1>🐉 DRAGON HUNTER 🗡️</h1>
            <p>Defeat the dragon and save the kingdom!</p>
            <input type="text" id="playerName" class="name-input" placeholder="Enter your name" maxlength="15">
            <br><br>
            <button onclick="startGame()" class="attack-btn">⚔️ Begin Adventure ⚔️</button>
            <div style="margin-top: 30px;">
                <p>✨ Choose your starting class ✨</p>
                <button onclick="selectClass('warrior')" id="btnWarrior" style="margin: 5px; background: #e74c3c;">🛡️ Warrior</button>
                <button onclick="selectClass('mage')" id="btnMage" style="margin: 5px; background: #3498db;">🔮 Mage</button>
                <button onclick="selectClass('rogue')" id="btnRogue" style="margin: 5px; background: #27ae60;">🗡️ Rogue</button>
            </div>
            <p id="classDisplay" style="margin-top: 15px; color: #ffd93d;"></p>
        </div>
        
        <!-- Game Screen -->
        <div id="gameScreen" style="display: none;">
            <h1>🐉 Dragon Hunter 🗡️</h1>
            <p id="playerNameDisplay" style="font-size: 18px;"></p>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">❤️ HEALTH</div>
                    <div class="stat-value" id="healthValue">100</div>
                    <div class="health-bar">
                        <div class="health-fill" id="healthFill" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">⚔️ ATTACK</div>
                    <div class="stat-value" id="attackValue">20</div>
                </div>
                <div class="stat">
                    <div class="stat-label">🛡️ DEFENSE</div>
                    <div class="stat-value" id="defenseValue">10</div>
                </div>
                <div class="stat">
                    <div class="stat-label">🏆 SCORE</div>
                    <div class="stat-value" id="scoreValue">0</div>
                </div>
            </div>
            
            <div class="enemy">
                <div class="enemy-art" id="enemyArt">🐉</div>
                <div class="enemy-name" id="enemyName">Dragon</div>
                <div class="health-bar">
                    <div class="health-fill" id="enemyHealthFill" style="width: 100%; background: linear-gradient(90deg, #ff6b6b, #ff4757);"></div>
                </div>
                <div id="enemyHealthText" style="margin-top: 5px;">HP: 150/150</div>
            </div>
            
            <div class="actions">
                <button class="attack-btn" onclick="playerAttack()">⚔️ ATTACK ⚔️</button>
                <button class="heal-btn" onclick="playerHeal()">💚 HEAL 💚</button>
                <button class="heal-btn" onclick="usePowerUp()">✨ POWER UP ✨</button>
                <button class="restart-btn" onclick="resetGame()">🔄 RESTART 🔄</button>
            </div>
            
            <div class="log" id="combatLog">
                <div class="log-entry">✨ Welcome, brave warrior!</div>
                <div class="log-entry">🐉 A fierce dragon stands before you!</div>
                <div class="log-entry">⚔️ Defeat it to save the kingdom!</div>
            </div>
        </div>
    </div>

    <script>
        // Game variables
        let player = {
            name: "Hero",
            health: 100,
            maxHealth: 100,
            attack: 20,
            defense: 10,
            score: 0,
            class: "warrior"
        };
        
        let enemy = {
            name: "Dragon",
            health: 150,
            maxHealth: 150,
            attack: 15,
            art: "🐉"
        };
        
        let powerUpActive = false;
        let selectedClass = "warrior";
        
        // Class selection
        function selectClass(className) {
            selectedClass = className;
            let classDisplay = document.getElementById("classDisplay");
            
            if (className === "warrior") {
                classDisplay.innerHTML = "🛡️ Warrior selected - High health and defense!";
                document.getElementById("btnWarrior").style.opacity = "1";
                document.getElementById("btnMage").style.opacity = "0.6";
                document.getElementById("btnRogue").style.opacity = "0.6";
            } else if (className === "mage") {
                classDisplay.innerHTML = "🔮 Mage selected - High attack power!";
                document.getElementById("btnWarrior").style.opacity = "0.6";
                document.getElementById("btnMage").style.opacity = "1";
                document.getElementById("btnRogue").style.opacity = "0.6";
            } else if (className === "rogue") {
                classDisplay.innerHTML = "🗡️ Rogue selected - Balanced stats!";
                document.getElementById("btnWarrior").style.opacity = "0.6";
                document.getElementById("btnMage").style.opacity = "0.6";
                document.getElementById("btnRogue").style.opacity = "1";
            }
        }
        
        // Start game
        function startGame() {
            let nameInput = document.getElementById("playerName").value;
            if (nameInput.trim() === "") {
                player.name = "Hero";
            } else {
                player.name = nameInput.trim();
            }
            
            // Set class stats
            if (selectedClass === "warrior") {
                player.maxHealth = 130;
                player.health = 130;
                player.attack = 18;
                player.defense = 12;
            } else if (selectedClass === "mage") {
                player.maxHealth = 85;
                player.health = 85;
                player.attack = 28;
                player.defense = 8;
            } else if (selectedClass === "rogue") {
                player.maxHealth = 100;
                player.health = 100;
                player.attack = 22;
                player.defense = 10;
            }
            
            player.class = selectedClass;
            player.score = 0;
            
            // Reset enemy
            enemy.health = enemy.maxHealth;
            
            // Update UI
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            document.getElementById("playerNameDisplay").innerHTML = "⚔️ " + player.name + " the " + selectedClass.toUpperCase() + " ⚔️";
            
            updateUI();
            addLog("✨ " + player.name + " the " + selectedClass + " has arrived!", "log-entry");
            addLog("🐉 The dragon roars menacingly!", "log-entry");
        }
        
        // Player attack
        function playerAttack() {
            if (enemy.health <= 0) {
                addLog("⚠️ The dragon is already defeated! Press RESTART to fight again!", "log-entry");
                return;
            }
            
            if (player.health <= 0) {
                addLog("💀 You are defeated! Press RESTART to try again!", "log-entry");
                return;
            }
            
            let damage = Math.floor(Math.random() * player.attack) + 10;
            if (powerUpActive) {
                damage = Math.floor(damage * 1.5);
                addLog("✨ POWER UP ACTIVE! Extra damage! ✨", "log-entry");
                powerUpActive = false;
            }
            
            let isCritical = Math.random() < 0.2;
            if (isCritical) {
                damage = Math.floor(damage * 1.8);
                addLog("💥 CRITICAL HIT! 💥", "log-entry");
            }
            
            enemy.health -= damage;
            if (enemy.health < 0) enemy.health = 0;
            
            addLog(`⚔️ You hit the ${enemy.name} for ${damage} damage!`, "log-entry");
            updateUI();
            
            if (enemy.health <= 0) {
                player.score += 100;
                updateUI();
                addLog(`🏆 VICTORY! You defeated the ${enemy.name}! +100 points! 🏆`, "log-entry");
                addLog(`🌟 ${player.name} the ${player.class} saved the kingdom! 🌟`, "log-entry");
                showVictory();
                return;
            }
            
            enemyTurn();
        }
        
        // Player heal
        function playerHeal() {
            if (player.health <= 0) return;
            
            let healAmount = Math.floor(Math.random() * 30) + 20;
            player.health += healAmount;
            if (player.health > player.maxHealth) player.health = player.maxHealth;
            
            addLog(`💚 You healed for ${healAmount} HP!`, "log-entry");
            updateUI();
            enemyTurn();
        }
        
        // Power up
        function usePowerUp() {
            if (player.health <= 0) return;
            
            powerUpActive = true;
            addLog(`✨ Power Up activated! Your next attack will be 50% stronger! ✨`, "log-entry");
            updateUI();
            enemyTurn();
        }
        
        // Enemy turn
        function enemyTurn() {
            if (enemy.health <= 0) return;
            if (player.health <= 0) return;
            
            let damage = Math.floor(Math.random() * enemy.attack) + 5;
            let finalDamage = Math.max(1, damage - Math.floor(player.defense / 2));
            
            player.health -= finalDamage;
            if (player.health < 0) player.health = 0;
            
            addLog(`🐉 ${enemy.name} hits you for ${finalDamage} damage!`, "log-entry");
            updateUI();
            
            if (player.health <= 0) {
                addLog(`💀 GAME OVER! ${player.name} has been defeated! 💀`, "log-entry");
                showGameOver();
            }
        }
        
        // Reset game
        function resetGame() {
            location.reload();
        }
        
        // Update UI
        function updateUI() {
            // Player stats
            document.getElementById("healthValue").innerHTML = Math.floor(player.health);
            let healthPercent = (player.health / player.maxHealth) * 100;
            document.getElementById("healthFill").style.width = healthPercent + "%";
            document.getElementById("attackValue").innerHTML = player.attack + (powerUpActive ? " [+50%]" : "");
            document.getElementById("defenseValue").innerHTML = player.defense;
            document.getElementById("scoreValue").innerHTML = player.score;
            
            // Enemy stats
            let enemyPercent = (enemy.health / enemy.maxHealth) * 100;
            document.getElementById("enemyHealthFill").style.width = enemyPercent + "%";
            document.getElementById("enemyHealthText").innerHTML = `HP: ${Math.floor(enemy.health)}/${enemy.maxHealth}`;
            
            // Enemy art based on health
            if (enemy.health > 100) {
                document.getElementById("enemyArt").innerHTML = "🐉";
                document.getElementById("enemyName").innerHTML = "Fierce Dragon";
            } else if (enemy.health > 50) {
                document.getElementById("enemyArt").innerHTML = "🐲";
                document.getElementById("enemyName").innerHTML = "Wounded Dragon";
            } else if (enemy.health > 0) {
                document.getElementById("enemyArt").innerHTML = "💀";
                document.getElementById("enemyName").innerHTML = "Dying Dragon";
            } else {
                document.getElementById("enemyArt").innerHTML = "🏆";
                document.getElementById("enemyName").innerHTML = "Defeated Dragon";
            }
        }
        
        // Add message to log
        function addLog(message, className) {
            const log = document.getElementById("combatLog");
            const entry = document.createElement("div");
            entry.className = className || "log-entry";
            entry.innerHTML = message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            
            while (log.children.length > 15) {
                log.removeChild(log.firstChild);
            }
        }
        
        // Show victory screen
        function showVictory() {
            setTimeout(() => {
                alert(`🏆 VICTORY! 🏆\n\n${player.name} the ${player.class} has defeated the dragon!\nScore: ${player.score}\n\nClick RESTART to play again!`);
            }, 100);
        }
        
        // Show game over screen
        function showGameOver() {
            setTimeout(() => {
                alert(`💀 GAME OVER 💀\n\n${player.name} the ${player.class} has fallen in battle.\nScore: ${player.score}\n\nClick RESTART to try again!`);
            }, 100);
        }
    </script>
</body>
</html>
