// ============================================================
// GAME STATE
// ============================================================
let G = {};

function initGame(cls, name) {
  const c = CLASSES[cls];
  G = {
    name: name || 'Hero',
    cls: cls,
    clsName: c.name,
    level: 1,
    hp: c.hp, maxHp: c.hp,
    mp: c.mp, maxMp: c.mp,
    atk: c.atk, def: c.def,
    critChance: c.critChance,
    xp: 0, xpNext: 100,
    gold: 50,
    skills: c.skills,
    inventory: { '🧪': 2, '🍖': 1 },
    equipped: { weapon: null, armor: null },
    quests: [],
    completedQuests: [],
    bonusDmg: 1,
    currentScene: 'village',
    inCombat: false,
    enemy: null,
  };
}

// ============================================================
// UI
// ============================================================
function updateHUD() {
  document.getElementById('hud-level').textContent = G.level;
  document.getElementById('hud-name').textContent = G.name;
  document.getElementById('hud-class').textContent = CLASSES[G.cls].icon + ' ' + G.clsName;
  document.getElementById('hud-gold').textContent = G.gold;

  const hp = G.hp / G.maxHp * 100;
  const mp = G.mp / G.maxMp * 100;
  const xp = G.xp / G.xpNext * 100;

  document.getElementById('bar-hp').style.width = hp + '%';
  document.getElementById('bar-mp').style.width = mp + '%';
  document.getElementById('bar-xp').style.width = xp + '%';
  document.getElementById('val-hp').textContent = G.hp + '/' + G.maxHp;
  document.getElementById('val-mp').textContent = G.mp + '/' + G.maxMp;
  document.getElementById('val-xp').textContent = G.xp + '/' + G.xpNext;

  updateStats();
  renderInventory();
  renderQuests();
}

function updateStats() {
  document.getElementById('stats-list').innerHTML = `
    <div class="stat-row"><span class="sn">⚔️ Attack</span><span class="sv">${G.atk}</span></div>
    <div class="stat-row"><span class="sn">🛡️ Defense</span><span class="sv">${G.def}</span></div>
    <div class="stat-row"><span class="sn">💥 Crit %</span><span class="sv">${Math.round(G.critChance*100)}%</span></div>
    <div class="stat-row"><span class="sn">✨ Skill 1</span><span class="sv">${G.skills[0]}</span></div>
    <div class="stat-row"><span class="sn">✨ Skill 2</span><span class="sv">${G.skills[1]}</span></div>
    <div class="stat-row"><span class="sn">🪙 Gold</span><span class="sv">${G.gold}</span></div>
  `;
}

function renderInventory() {
  const grid = document.getElementById('inventory-grid');
  grid.innerHTML = '';
  const slots = 12;
  const items = Object.entries(G.inventory).filter(([k,v]) => v > 0);
  items.forEach(([icon, count]) => {
    const info = ITEMS[icon] || {};
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    if (G.equipped.weapon === icon || G.equipped.armor === icon) slot.classList.add('equipped');
    slot.innerHTML = icon + (count > 1 ? <span class="inv-count">${count}</span> : '');
    slot.addEventListener('mouseenter', e => showTooltip(e, icon, info));
    slot.addEventListener('mouseleave', hideTooltip);
    slot.addEventListener('click', () => useItem(icon));
    grid.appendChild(slot);
  });
  for (let i = items.length; i < slots; i++) {
    const empty = document.createElement('div');
    empty.className = 'inv-slot';
    grid.appendChild(empty);
  }
}

function renderQuests() {
  const list = document.getElementById('quest-list');
  const all = [...G.quests.map(q => ({q, done:false})), ...G.completedQuests.map(q => ({q, done:true}))];
  if (all.length === 0) {
    list.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; padding:6px 0;">No active quests.</div>';
    return;
  }
  list.innerHTML = all.map(({q,done}) =>
    <div class="quest-item ${done?'quest-done':''}"><span class="quest-dot">${done?'✓':'◆'}</span>${q}</div>
  ).join('');
}

function showTooltip(e, icon, info) {
  if (!info.name) return;
  const tt = document.getElementById('tooltip');
  document.getElementById('tt-name').textContent = info.name;
  document.getElementById('tt-desc').textContent = info.desc || '';
  document.getElementById('tt-stat').textContent = info.use === 'equip' ? ('Equip: ' + JSON.stringify(info.stat).replace(/[{}"]/g,'')) : '';
  tt.style.display = 'block';
  tt.style.left = (e.clientX + 12) + 'px';
  tt.style.top = (e.clientY + 12) + 'px';
}

function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

function notify(msg) {
  const n = document.createElement('div');
  n.className = 'notif';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3100);
}

function showModal(art, title, text, actions) {
  document.getElementById('modal-art').textContent = art;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  const actDiv = document.getElementById('modal-actions');
  actDiv.innerHTML = '';
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = a.label;
    b.onclick = () => { closeModal(); a.action(); };
    actDiv.appendChild(b);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

// ============================================================
// SCENES
// ============================================================
function loadScene(id, opts = {}) {
  const scene = SCENES.find(s => s.id === id);
  if (!scene) return;

  G.currentScene = id;
  G.inCombat = false;
  document.getElementById('combat-panel').style.display = 'none';
  document.getElementById('scene-panel').style.display = '';

  document.getElementById('scene-location').textContent = scene.location;
  document.getElementById('scene-icon').textContent = scene.icon;
  document.getElementById('scene-art').textContent = scene.art;

  let text = scene.text;
  if (opts.loot) {
    const gold = rand(10, 40);
    G.gold += gold;
    addItem('🧪', 1);
    if (Math.random() < 0.3) addItem('💎', 1);
    text = You pry open the ancient chest. Inside you find ${gold} gold coins, a Health Potion, and perhaps something rare!;
    notify(Found ${gold} gold & loot!);
  }
  document.getElementById('scene-text').textContent = text;

  if (scene.isShop) {
    renderShop(scene);
  } else {
    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';
    scene.choices.forEach(c => {
      if (c.next === 'combat' && G.enemy === null && opts.fromCombat) return;
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c.text;
      btn.onclick = () => handleChoice(c);
      choicesDiv.appendChild(btn);
    });
  }
  updateHUD();
}

function handleChoice(c) {
  if (c.quest) addQuest(c.quest);
  if (c.rest) {
    if (G.gold < 10) { notify('❌ Not enough gold!'); return; }
    G.gold -= 10;
    G.hp = G.maxHp; G.mp = G.maxMp;
    notify('😴 Fully restored!');
    loadScene(c.next);
    return;
  }
  if (c.loot) { loadScene(c.next, { loot: true }); return; }
  if (c.skillCheck) {
    const roll = rand(1,20) + Math.floor(G.def / 3);
    if (roll < c.skillCheck.dc) {
      notify('❌ Failed the check! Forced into combat.');
      loadScene('forest');
      setTimeout(() => startCombat(0), 400);
      return;
    }
  }
  if (c.next === 'combat') {
    if (c.bonus) G.bonusDmg = c.bonus;
    loadScene(SCENES.find(s => s.id === G.currentScene).id);
    startCombat(c.enemy, c.final);
    return;
  }
  loadScene(c.next);
}

function renderShop(scene) {
  const shopItems = [
    { icon: '🧪', price: 15 },
    { icon: '💧', price: 12 },
    { icon: '⚗️', price: 40 },
    { icon: CLASSES[G.cls] === CLASSES.warrior ? '⚔️' : G.cls === 'mage' ? '🔮' : G.cls === 'rogue' ? '🗡️' : '🏹', price: 32 },
    { icon: '🛡️', price: 25 },
  ];

  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '<div class="shop-items">' +
    shopItems.map(si => {
      const info = ITEMS[si.icon];
      return `<div class="shop-item" onclick="buyItem('${si.icon}',${si.price})">
        <span class="shop-icon">${si.icon}</span>
        <div class="shop-info">
          <div class="shop-name">${info.name}</div>
          <div class="shop-desc">${info.desc}</div>
        </div>
        <span class="shop-price">🪙 ${si.price}</span>
      </div>`;
    }).join('') + '</div>' +
    '<div style="padding:10px;">' +
    scene.choices.map(c => <button class="btn btn-sm" onclick="loadScene('${c.next}')" style="width:100%;margin-top:4px;">${c.text}</button>).join('') +
    '</div>';
}

function buyItem(icon, price) {
  if (G.gold < price) { notify('❌ Not enough gold!'); return; }
  G.gold -= price;
  addItem(icon, 1);
  notify(Bought ${ITEMS[icon].name}!);
  updateHUD();
}

function useItem(icon) {
  if (!G.inventory[icon] || G.inventory[icon] <= 0) return;
  const info = ITEMS[icon];
  if (info.use === 'heal') {
    G.hp = Math.min(G.maxHp, G.hp + info.val);
    G.inventory[icon]--;
    notify(❤️ Healed ${info.val} HP!);
  } else if (info.use === 'mana') {
    G.mp = Math.min(G.maxMp, G.mp + info.val);
    G.inventory[icon]--;
    notify💧 Restored ${info.val} MP!`);
  } else if (info.use === 'elixir') {
    G.hp = Math.min(G.maxHp, G.hp + info.val);
    G.mp = Math.min(G.maxMp, G.mp + 50);
    G.inventory[icon]--;
    notify(⚗️ Restored HP & MP!);
  } else if (info.use === 'equip') {
    const slot = info.slot;
    if (G.equipped[slot]) {
      // unequip previous
      const prev = G.equipped[slot];
      const prevInfo = ITEMS[prev];
      if (prevInfo && prevInfo.stat) {
        Object.entries(prevInfo.stat).forEach(([k,v]) => { if (k === 'crit') G.critChance -= v; else G[k] -= v; });
      }
    }
    G.equipped[slot] = icon;
    Object.entries(info.stat).forEach(([k,v]) => { if (k === 'crit') G.critChance += v; else G[k] += v; });
    notify(Equipped ${info.name}!);
  } else if (info.use === 'sell') {
    G.gold += info.val;
    G.inventory[icon]--;
    notify💰 Sold for ${info.val} gold!`);
  }
  updateHUD();
}

function addItem(icon, count) {
  G.inventory[icon] = (G.inventory[icon] || 0) + count;
}

function addQuest(q) {
  if (!G.quests.includes(q) && !G.completedQuests.includes(q)) G.quests.push(q);
}

function completeQuest(q) {
  G.quests = G.quests.filter(x => x !== q);
  if (!G.completedQuests.includes(q)) G.completedQuests.push(q);
}

// ============================================================
// COMBAT
// ============================================================
let currentEnemy = null;
let isFinalBoss = false;

function startCombat(enemyIdx, final = false) {
  const e = ENEMIES[enemyIdx];
  isFinalBoss = final;
  currentEnemy = { ...e, currentHp: e.hp };

  G.inCombat = true;
  document.getElementById('combat-panel').style.display = '';

  document.getElementById('enemy-art').textContent = e.icon;
  document.getElementById('enemy-name').textContent = e.name;
  updateEnemyHP();

  const log = document.getElementById('combat-log');
  log.innerHTML = <span class="log-victory">⚔️ A ${e.name} appears!</span><br>;

  // Update skill button label
  document.getElementById('btn-skill').textContent = ✨ ${G.skills[0]};
  document.getElementById('scene-panel').style.display = 'none';
}

function updateEnemyHP() {
  const pct = Math.max(0, currentEnemy.currentHp / currentEnemy.hp * 100);
  document.getElementById('enemy-hp-bar').style.width = pct + '%';
  document.getElementById('enemy-hp-val').textContent = Math.max(0, currentEnemy.currentHp) + '/' + currentEnemy.hp;
}

function combatLog(msg, cls = '') {
  const log = document.getElementById('combat-log');
  log.innerHTML += <span class="${cls}">${msg}</span><br>;
  log.scrollTop = log.scrollHeight;
}

function combatAction(action) {
  if (!G.inCombat || !currentEnemy) return;

  if (action === 'attack') {
    playerAttack(G.atk, false);
  } else if (action === 'skill') {
    const skillName = G.skills[0];
    const skill = SKILLS[skillName];
    if (!skill) return;
    if (G.mp < skill.mp) { combatLog('❌ Not enough MP!', 'log-miss'); return; }
    G.mp -= skill.mp;

    if (skill.flee) {
      combatLog💨 You vanish in a cloud of smoke!`, 'log-miss');
      endCombat(false);
      return;
    }
    if (skill.heal) {
      G.hp = Math.min(G.maxHp, G.hp + skill.heal);
      combatLog(${skill.icon} ${skillName}: Restored ${skill.heal} HP!, 'log-heal');
      updateHUD();
      enemyTurn();
      return;
    }
    if (skill.hits) {
      let total = 0;
      for (let i = 0; i < skill.hits; i++) {
        const dmg = playerAttack(G.atk * skill.dmg, true, true);
        total += dmg;
        if (currentEnemy.currentHp <= 0) break;
      }
      if (currentEnemy.currentHp > 0) enemyTurn();
      return;
    }
    const critMod = skill.crit ? skill.crit : G.critChance;
    playerAttack(G.atk * skill.dmg, true, false, skillName, critMod);
  } else if (action === 'item') {
    const potions = Object.entries(G.inventory).filter(([k,v]) => v > 0 && ['🧪','💧','⚗️','🍖'].includes(k));
    if (potions.length === 0) { combatLog('❌ No usable items!', 'log-miss'); return; }
    const [icon] = potions[0];
    const info = ITEMS[icon];
    useItem(icon);
    combatLog(Used ${info.name}!, 'log-heal');
    enemyTurn();
    return;
  } else if (action === 'flee') {
    if (Math.random() < 0.5) {
      combatLog('🏃 You successfully flee!', 'log-miss');
      endCombat(false);
    } else {
      combatLog('❌ Failed to flee!', 'log-miss');
      enemyTurn();
    }
  }
}

function playerAttack(atkPower, isSkill = false, silent = false, skillName = '', critOverride = null) {
  const isCrit = Math.random() < (critOverride !== null ? critOverride : G.critChance);
  let dmg = Math.max(1, Math.round(atkPower * G.bonusDmg * (0.85 + Math.random() * 0.3) - currentEnemy.def * 0.4));
  if (isCrit) dmg = Math.round(dmg * 1.75);
  dmg = Math.max(1, dmg);
  currentEnemy.currentHp -= dmg;
  updateEnemyHP();

  if (!silent) {
    const label = isSkill && skillName ? skillName : 'Attack';
    if (isCrit) combatLog💥 CRITICAL! ${label} deals ${dmg} damage!`, 'log-crit');
    else combatLog(⚔️ Your ${label} deals ${dmg} damage., 'log-player');
  }

  updateHUD();
  if (currentEnemy.currentHp <= 0) { endCombat(true); return dmg; }
  if (!silent) enemyTurn();
  return dmg;
}

function enemyTurn() {
  if (!G.inCombat || !currentEnemy || currentEnemy.currentHp <= 0) return;
  const dmg = Math.max(1, Math.round(currentEnemy.atk * (0.85 + Math.random() * 0.3) - G.def * 0.5));
  G.hp -= dmg;
  combatLog(${currentEnemy.icon} ${currentEnemy.name} hits you for ${dmg} damage!, 'log-hit');
  updateHUD();
  if (G.hp <= 0) {
    G.hp = 0;
    combatLog('💀 You have fallen...', 'log-miss');
    setTimeout(() => showGameOver(), 600);
  }
}

function endCombat(won) {
  G.inCombat = false;
  G.bonusDmg = 1;
  document.getElementById('combat-panel').style.display = 'none';
  document.getElementById('scene-panel').style.display = '';

  if (!won) {
    loadScene(G.currentScene);
    return;
  }

  const e = currentEnemy;
  const xpGain = e.xp;
  const goldGain = rand(e.gold[0], e.gold[1]);
  G.xp += xpGain;
  G.gold += goldGain;

  // Loot
  let lootMsg = '';
  Object.entries(e.loot || {}).forEach(([icon, chance]) => {
    if (Math.random() < chance) {
      addItem(icon, 1);
      lootMsg += Found ${ITEMS[icon]?.name || icon}!`;
    }
  });

  combatLog🏆 Victory! +${xpGain} XP, +${goldGain} Gold.${lootMsg}`, 'log-victory');

  // Complete quests
  if (G.currentScene === 'ruins' || G.currentScene === 'ruins_hint') completeQuest('Find the Eastern Ruins');

  // Level up
  while (G.xp >= G.xpNext) {
    G.xp -= G.xpNext;
    G.level++;
    G.xpNext = Math.round(G.xpNext * 1.4);
    G.maxHp = Math.round(G.maxHp * 1.15);
    G.hp = G.maxHp;
    G.maxMp = Math.round(G.maxMp * 1.1);
    G.mp = G.maxMp;
    G.atk = Math.round(G.atk * 1.1);
    G.def = Math.round(G.def * 1.1);
    notify🎉 Level Up! Now Level ${G.level}!`);
  }

  if (isFinalBoss) {
    setTimeout(() => showVictory(), 800);
    return;
  }

  setTimeout(() => loadScene(G.currentScene), 1000);
  updateHUD();
}

function showGameOver() {
  showModal('💀', 'You Have Fallen', 'The darkness consumes you. Your journey ends here, brave adventurer... but legends are never truly forgotten.', [
    { label: 'Try Again', action: () => { document.querySelector('#game-screen').classList.remove('active'); document.querySelector('#title-screen').classList.add('active'); } }
  ]);
}

function showVictory() {
  completeQuest('Find the Eastern Ruins');
  showModal('🏆', 'Victory!', With a final blow, the Demon Lord crumbles to ash. The realm is saved! You, ${G.name} the ${G.clsName}, shall be remembered for eternity. You reached Level ${G.level}., [
    { label: '🌟 Play Again', action: () => { document.querySelector('#game-screen').classList.remove('active'); document.querySelector('#title-screen').classList.add('active'); } }
  ]);
}

// ============================================================
// HELPERS
// ============================================================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ============================================================
// TITLE SCREEN
// ============================================================
let selectedClass = null;

function selectClass(el) {
  document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedClass = el.dataset.class;
}

function startGame() {
  if (!selectedClass) { notify('Please select a class!'); return; }
  const nameInput = document.getElementById('player-name-input');
  const name = nameInput.value.trim() || 'Hero';

  initGame(selectedClass, name);

  document.getElementById('title-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');

  loadScene('village');
  addQuest('Discover what threatens Millhaven');
}

// Pre-select warrior
document.addEventListener('DOMContentLoaded', () => {
  const first = document.querySelector('.class-card');
  if (first) { first.classList.add('selected'); selectedClass = 'warrior'; }
});
</script>
</body>
</html>

