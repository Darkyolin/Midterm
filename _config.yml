<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes of the Forgotten Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --dark: #0a0806;
    --deep: #120e09;
    --panel: #1a1208;
    --border: #3a2a10;
    --text: #d4c4a0;
    --muted: #7a6a50;
    --red: #c0392b;
    --green: #27ae60;
    --blue: #2980b9;
    --purple: #8e44ad;
    --hp-color: #e74c3c;
    --mp-color: #3498db;
    --xp-color: #f39c12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 17px;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(142,68,173,0.04) 0%, transparent 50%);
  }

  h1, h2, h3, .title-font { font-family: 'Cinzel', serif; }

  #app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }

  /* TITLE SCREEN */
  #title-screen {
    text-align: center;
    padding: 60px 20px;
    animation: fadeIn 1.5s ease;
  }

  .game-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.5), 0 0 60px rgba(201,168,76,0.2);
    letter-spacing: 4px;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .game-subtitle {
    font-size: 1.1rem;
    color: var(--muted);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .title-art {
    font-size: 5rem;
    margin-bottom: 40px;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.4));
    animation: float 3s ease-in-out infinite;
  }

  .class-select {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin: 30px 0;
    text-align: left;
  }

  .class-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .class-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(201,168,76,0.05));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .class-card:hover { border-color: var(--gold); transform: translateY(-3px); }
  .class-card:hover::before { opacity: 1; }
  .class-card.selected { border-color: var(--gold); background: #1f1808; }

  .class-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .class-name { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); margin-bottom: 6px; }
  .class-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
  .class-stats { margin-top: 10px; font-size: 0.8rem; color: var(--text); }

  .btn {
    background: linear-gradient(135deg, #2a1f08, #1a1208);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 2px;
    padding: 14px 36px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .btn:hover {
    background: linear-gradient(135deg, #3a2f10, #2a1f08);
    box-shadow: 0 0 20px rgba(201,168,76,0.3);
    transform: translateY(-2px);
  }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { box-shadow: 0 0 20px rgba(192,57,43,0.3); }
  .btn-sm { padding: 8px 18px; font-size: 0.8rem; letter-spacing: 1px; }

  /* GAME SCREEN */
  #game-screen { animation: fadeIn 0.5s ease; }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .player-info { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  .player-name {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 1.1rem;
  }

  .stat-bars { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }

  .stat-bar-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
  .stat-label { width: 28px; color: var(--muted); }

  .bar-bg {
    flex: 1;
    height: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 5px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.5s ease;
  }

  .bar-hp { background: linear-gradient(90deg, #c0392b, #e74c3c); }
  .bar-mp { background: linear-gradient(90deg, #2471a3, #3498db); }
  .bar-xp { background: linear-gradient(90deg, #d68910, #f39c12); }

  .stat-val { width: 50px; text-align: right; font-size: 0.8rem; color: var(--muted); }

  .level-badge {
    background: linear-gradient(135deg, #2a1f08, #3a2a10);
    border: 1px solid var(--gold);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
  }

  .level-badge .lv { font-size: 0.55rem; color: var(--muted); letter-spacing: 1px; }
  .level-badge .ln { font-size: 1rem; color: var(--gold); font-weight: 700; line-height: 1; }

  .gold-display {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.9rem;
  }

  /* MAIN LAYOUT */
  .game-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 16px;
  }

  @media (max-width: 650px) {
    .game-layout { grid-template-columns: 1fr; }
  }

  /* SCENE PANEL */
  .scene-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .scene-header {
    padding: 14px 18px;
    background: linear-gradient(135deg, #1f1808, #150f06);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .scene-location {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--gold);
  }

  .scene-icon { font-size: 1.5rem; }

  .scene-art {
    text-align: center;
    padding: 20px;
    font-size: 4rem;
    background: linear-gradient(180deg, #120e09, #0a0806);
    border-bottom: 1px solid var(--border);
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  .scene-text {
    padding: 18px;
    line-height: 1.8;
    font-size: 1rem;
    color: var(--text);
    min-height: 100px;
    font-style: italic;
  }

  .choices {
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  .choice-btn {
    background: rgba(201,168,76,0.06);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .choice-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.1);
    padding-left: 20px;
  }

  /* COMBAT */
  .combat-panel {
    padding: 18px;
  }

  .enemy-display {
    text-align: center;
    padding: 20px;
    background: linear-gradient(180deg, #120e09, #0a0806);
    border-radius: 6px;
    margin-bottom: 16px;
  }

  .enemy-art { font-size: 4rem; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(192,57,43,0.4)); animation: enemyFloat 2s ease-in-out infinite; }
  .enemy-name { font-family: 'Cinzel', serif; color: var(--red); font-size: 1.2rem; margin-bottom: 8px; }
  .enemy-hp-bar { margin: 0 auto; max-width: 200px; }

  .combat-log {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    height: 140px;
    overflow-y: auto;
    font-size: 0.9rem;
    line-height: 1.8;
    margin-bottom: 14px;
  }

  .log-hit { color: #e74c3c; }
  .log-player { color: #f39c12; }
  .log-heal { color: #27ae60; }
  .log-miss { color: var(--muted); }
  .log-crit { color: #e67e22; font-weight: bold; }
  .log-magic { color: #9b59b6; }
  .log-victory { color: var(--gold); font-family: 'Cinzel', serif; }

  .combat-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* SIDE PANEL */
  .side-panel { display: flex; flex-direction: column; gap: 16px; }

  .panel-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 2px;
    padding: 10px 14px;
    background: rgba(201,168,76,0.06);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }

  .inventory-grid {
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .inv-slot {
    aspect-ratio: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .inv-slot:hover { border-color: var(--gold); background: rgba(201,168,76,0.1); }
  .inv-slot.equipped { border-color: var(--gold); background: rgba(201,168,76,0.15); }

  .inv-count {
    position: absolute;
    bottom: 2px; right: 4px;
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'Cinzel', serif;
  }

  .stats-list { padding: 12px 14px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 0.9rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .sn { color: var(--muted); }
  .stat-row .sv { color: var(--text); font-family: 'Cinzel', serif; }

  .quest-list { padding: 10px 14px; }
  .quest-item {
    padding: 6px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.4;
  }
  .quest-item:last-child { border-bottom: none; }
  .quest-dot { color: var(--gold); flex-shrink: 0; margin-top: 2px; }
  .quest-done { text-decoration: line-through; color: var(--muted); }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: #1f1808;
    border: 1px solid var(--gold);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 0.85rem;
    pointer-events: none;
    z-index: 999;
    max-width: 200px;
    display: none;
  }
  .tooltip-name { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 4px; }
  .tooltip-desc { color: var(--muted); line-height: 1.5; }
  .tooltip-stat { color: var(--green); margin-top: 4px; }

  /* NOTIFICATIONS */
  .notif {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #1f1808;
    border: 1px solid var(--gold);
    padding: 12px 18px;
    border-radius: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--gold);
    z-index: 1000;
    animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
    max-width: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
    display: none;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    animation: scaleIn 0.3s ease;
  }

  .modal h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 14px; font-size: 1.6rem; }
  .modal p { color: var(--text); line-height: 1.7; margin-bottom: 20px; }
  .modal-art { font-size: 4rem; margin-bottom: 16px; }

  /* SHOP */
  .shop-items { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .shop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .shop-item:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }
  .shop-icon { font-size: 1.4rem; width: 28px; text-align: center; }
  .shop-info { flex: 1; }
  .shop-name { color: var(--text); }
  .shop-desc { font-size: 0.75rem; color: var(--muted); }
  .shop-price { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.85rem; }

  /* NAME INPUT */
  .name-input-wrap { margin: 20px 0; }
  .name-input {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    text-align: center;
    padding: 10px 20px;
    width: 100%;
    max-width: 300px;
    letter-spacing: 3px;
    outline: none;
    border-radius: 4px 4px 0 0;
  }
  .name-input::placeholder { color: var(--muted); font-size: 1rem; }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes enemyFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }
  @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .shake { animation: shake 0.3s ease; }
  .pulse { animation: pulse 1s ease infinite; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE SCREEN -->
  <div id="title-screen" class="screen active">
    <div class="title-art">⚔️</div>
    <div class="game-title">Echoes of the<br>Forgotten Realm</div>
    <div class="game-subtitle">An Epic RPG Adventure</div>

    <div style="margin-bottom:20px;">
      <div class="name-input-wrap">
        <input type="text" class="name-input" id="player-name-input" placeholder="Enter Your Name" maxlength="16">
      </div>
    </div>

    <div style="margin-bottom: 16px; font-family:'Cinzel',serif; color:var(--muted); font-size:0.85rem; letter-spacing:2px;">CHOOSE YOUR CLASS</div>
    <div class="class-select" id="class-select">
      <div class="class-card" data-class="warrior" onclick="selectClass(this)">
        <div class="class-icon">🛡️</div>
        <div class="class-name">Warrior</div>
        <div class="class-desc">Master of steel and shield. Unbreakable in battle.</div>
        <div class="class-stats">⚔️ ATK 18  🛡 DEF 15  ❤️ HP 120  💧 MP 40</div>
      </div>
      <div class="class-card" data-class="mage" onclick="selectClass(this)">
        <div class="class-icon">🔮</div>
        <div class="class-name">Mage</div>
        <div class="class-desc">Wielder of arcane forces. Spells of devastating power.</div>
        <div class="class-stats">⚔️ ATK 10  🛡 DEF 8  ❤️ HP 75  💧 MP 110</div>
      </div>
      <div class="class-card" data-class="rogue" onclick="selectClass(this)">
        <div class="class-icon">🗡️</div>
        <div class="class-name">Rogue</div>
        <div class="class-desc">Swift and lethal. Strikes from the shadows with precision.</div>
        <div class="class-stats">⚔️ ATK 15  🛡 DEF 10  ❤️ HP 90  💧 MP 60</div>
      </div>
      <div class="class-card" data-class="ranger" onclick="selectClass(this)">
        <div class="class-icon">🏹</div>
        <div class="class-name">Ranger</div>
        <div class="class-desc">Hunter of the wilds. Precise and resourceful.</div>
        <div class="class-stats">⚔️ ATK 14  🛡 DEF 11  ❤️ HP 95  💧 MP 65</div>
      </div>
    </div>

    <br>
    <button class="btn" onclick="startGame()">Begin Your Legend</button>
    <p style="margin-top:20px; color:var(--muted); font-size:0.85rem;">Your destiny awaits in the Forgotten Realm...</p>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <div class="player-info">
        <div class="level-badge">
          <span class="lv">LV</span>
          <span class="ln" id="hud-level">1</span>
        </div>
        <div>
          <div class="player-name" id="hud-name">Hero</div>
          <div style="font-size:0.8rem; color:var(--muted)" id="hud-class">Warrior</div>
        </div>
        <div class="stat-bars">
          <div class="stat-bar-wrap">
            <span class="stat-label">HP</span>
            <div class="bar-bg"><div class="bar-fill bar-hp" id="bar-hp" style="width:100%"></div></div>
            <span class="stat-val" id="val-hp">100/100</span>
          </div>
          <div class="stat-bar-wrap">
            <span class="stat-label">MP</span>
            <div class="bar-bg"><div class="bar-fill bar-mp" id="bar-mp" style="width:100%"></div></div>
            <span class="stat-val" id="val-mp">50/50</span>
          </div>
          <div class="stat-bar-wrap">
            <span class="stat-label">XP</span>
            <div class="bar-bg"><div class="bar-fill bar-xp" id="bar-xp" style="width:0%"></div></div>
            <span class="stat-val" id="val-xp">0/100</span>
          </div>
        </div>
      </div>
      <div class="gold-display">🪙 <span id="hud-gold">50</span></div>
    </div>

    <div class="game-layout">
      <!-- MAIN SCENE -->
      <div>
        <div class="scene-panel" id="scene-panel">
          <div class="scene-header">
            <span class="scene-location" id="scene-location">The Forgotten Realm</span>
            <span class="scene-icon" id="scene-icon">🏰</span>
          </div>
          <div class="scene-art" id="scene-art">🏰</div>
          <div class="scene-text" id="scene-text">Loading...</div>
          <div class="choices" id="choices"></div>
        </div>

        <!-- COMBAT PANEL (hidden by default) -->
        <div class="scene-panel" id="combat-panel" style="display:none; margin-top:16px;">
          <div class="scene-header">
            <span class="scene-location">⚔️ Combat</span>
          </div>
          <div class="combat-panel">
            <div class="enemy-display">
              <div class="enemy-art" id="enemy-art">👹</div>
              <div class="enemy-name" id="enemy-name">Enemy</div>
              <div class="enemy-hp-bar">
                <div class="stat-bar-wrap">
                  <span class="stat-label" style="color:var(--red)">HP</span>
                  <div class="bar-bg"><div class="bar-fill bar-hp" id="enemy-hp-bar" style="width:100%"></div></div>
                  <span class="stat-val" id="enemy-hp-val">100/100</span>
                </div>
              </div>
            </div>
            <div class="combat-log" id="combat-log"></div>
            <div class="combat-actions">
              <button class="btn btn-sm" onclick="combatAction('attack')">⚔️ Attack</button>
              <button class="btn btn-sm" id="btn-skill" onclick="combatAction('skill')">✨ Skill</button>
              <button class="btn btn-sm" onclick="combatAction('item')">🧪 Use Item</button>
              <button class="btn btn-sm btn-danger" onclick="combatAction('flee')">🏃 Flee</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SIDE PANEL -->
      <div class="side-panel">
        <div class="panel-box">
          <div class="panel-title">⚔️ Stats</div>
          <div class="stats-list" id="stats-list"></div>
        </div>
        <div class="panel-box">
          <div class="panel-title">🎒 Inventory</div>
          <div class="inventory-grid" id="inventory-grid"></div>
        </div>
        <div class="panel-box">
          <div class="panel-title">📜 Quests</div>
          <div class="quest-list" id="quest-list"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-desc" id="tt-desc"></div>
  <div class="tooltip-stat" id="tt-stat"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-art" id="modal-art">🏆</div>
    <h2 id="modal-title">Title</h2>
    <p id="modal-text">Text</p>
    <div id="modal-actions"></div>
